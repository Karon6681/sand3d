# Publish to PyPI when a GitHub release is published, by trusted publishing: no token
# is stored anywhere. PyPI trusts this file, in this repo, run in the `pypi` environment.
name: publish
on:
  release:
    types: [published]
permissions: {}
jobs:
  build:
    name: sdist and wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The release's tag is the library's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sand3d/__init__.py)
          test "$TAG" = "v$version" || { echo "tag $TAG, but sand3d.__version__ is $version"; exit 1; }
      - name: Build
        run: uv build --sdist --wheel --out-dir dist
      - name: Check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sand3d
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
